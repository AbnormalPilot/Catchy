name: Catchy
options:
  bundleIdPrefix: app.catchy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 56T7M6558P
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Catchy:
    type: application
    platform: macOS
    sources:
      - Catchy
    info:
      path: Catchy/Resources/Info.plist
      properties:
        CFBundleDisplayName: Catchy
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSCalendarsFullAccessUsageDescription: Catchy adds the events you catch to your calendar, and lets you pick which calendar (choose an iCloud one to see it on your iPhone and Watch).
        NSCalendarsWriteOnlyAccessUsageDescription: Catchy adds the events you catch to your calendar.
        NSRemindersFullAccessUsageDescription: Catchy adds the tasks you catch to Reminders.
        NSServices:
          - NSMessage: catchText
            NSPortName: Catchy
            NSMenuItem:
              default: Catch with Catchy
            NSSendTypes:
              - public.utf8-plain-text
              - NSStringPboardType
    entitlements:
      path: Catchy/Resources/Catchy.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
    scheme:
      testTargets:
        - CatchyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.catchy.Catchy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  CatchyTests:
    type: bundle.unit-test
    platform: macOS
    # The date and time-zone logic compiled straight in: no app host, so tests don't
    # start the menu bar app or watch the clipboard.
    sources:
      - CatchyTests
      - Catchy/Model/EventDraft.swift
      - Catchy/Services/DateHints.swift
      - Catchy/Services/TimeZones.swift
      - Catchy/Services/EventExtractor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.catchy.CatchyTests
        GENERATE_INFOPLIST_FILE: YES
